name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install fastapi uvicorn httpx openai cryptography pytest
      - name: Offline test suite (no API keys, no network, no money)
        run: python -m pytest
      - name: Red-team the isolated signer as a compromised gateway
        run: |
          python keys.py init
          python attack_signer.py
